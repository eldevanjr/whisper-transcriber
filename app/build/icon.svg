<!-- Ícone do app (fonte de build/icon.png e resources/icon.png — gere com `pnpm icons`).
     Balão azul com a onda sonora: o mesmo logo da tela de carregamento, com margem, brilho e
     sombra para os ícones de sistema. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-6 -5 60 60">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#0B2A6F" flood-opacity="0.45" />
    </filter>
  </defs>
  <path d="M14 2 H34 A12 12 0 0 1 46 14 V30 A12 12 0 0 1 34 42 H24 L14 49 V42 A12 12 0 0 1 2 30 V14 A12 12 0 0 1 14 2 Z" fill="url(#fill)" filter="url(#shadow)" />
  <path d="M14 2 H34 A12 12 0 0 1 46 14 V30 A12 12 0 0 1 34 42 H24 L14 49 V42 A12 12 0 0 1 2 30 V14 A12 12 0 0 1 14 2 Z" fill="url(#shine)" />
  <path d="M14 2 H34 A12 12 0 0 1 46 14 V30 A12 12 0 0 1 34 42 H24 L14 49 V42 A12 12 0 0 1 2 30 V14 A12 12 0 0 1 14 2 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.7"
    stroke-linejoin="round" transform="translate(24 25.5) scale(0.985) translate(-24 -25.5)" />
  <g stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round">
    <line x1="13" y1="19" x2="13" y2="25" />
    <line x1="19" y1="14" x2="19" y2="30" />
    <line x1="25" y1="10" x2="25" y2="34" />
    <line x1="31" y1="15" x2="31" y2="29" />
    <line x1="37" y1="19" x2="37" y2="25" />
  </g>
</svg>
